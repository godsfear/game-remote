<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Remote</title>
  <link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/panel-view.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>Game Remote</h1>
      <p data-i18n="editor.subtitle"></p>
    </div>
    <p id="save-state" role="status"></p>
  </header>
  <p id="fake" class="banner" data-i18n="editor.fakeInput" hidden></p>
  <p id="offline" class="banner bad" data-i18n="editor.offline" hidden></p>
  <main>
    <div class="column" id="left">
      <section id="games">
        <h2 data-i18n="editor.games"></h2>
        <ul id="game-list"></ul>
        <ul id="panel-errors"></ul>
        <button id="add-game" type="button" data-i18n="editor.addGame"></button>
      </section>
      <section id="connect">
        <h2 data-i18n="editor.connect"></h2>
        <p id="phones" class="waiting" role="status"></p>
        <ul id="device-list"></ul>
        <button id="show-qr" type="button" class="quiet" data-i18n="editor.showQr" hidden></button>
        <div id="connect-body">
          <div id="qr-box"><img id="qr" alt="QR" hidden><p id="no-address" data-i18n="editor.noAddress" hidden></p></div>
          <p class="hint" data-i18n="editor.connectHint"></p>
          <label id="address-row"><span data-i18n="editor.address"></span>
            <select id="address"></select>
          </label>
          <button id="copy-link" type="button" class="quiet" data-i18n="editor.copyLink"></button>
          <details>
            <summary data-i18n="editor.trouble"></summary>
            <ul>
              <li data-i18n="editor.trouble1"></li>
              <li data-i18n="editor.trouble2"></li>
              <li data-i18n="editor.trouble3"></li>
              <li data-i18n="editor.trouble4"></li>
            </ul>
          </details>
        </div>
      </section>
    </div>

    <div class="column" id="middle">
      <p id="no-game" class="empty" data-i18n="editor.noGame" hidden></p>
      <section id="game-card" hidden>
        <h2 data-i18n="editor.game"></h2>
        <label class="field"><span data-i18n="editor.gameName"></span>
          <input id="game-name" type="text" maxlength="60" autocomplete="off">
        </label>
        <div class="field"><span data-i18n="editor.columns"></span>
          <div class="stepper">
            <button id="columns-less" type="button" aria-label="−">−</button>
            <output id="columns"></output>
            <button id="columns-more" type="button" aria-label="+">+</button>
          </div>
        </div>
        <div class="field"><span data-i18n="editor.cover"></span>
          <div class="image-row">
            <span class="thumb" id="cover-thumb"></span>
            <button id="cover-choose" type="button" data-i18n="editor.chooseImage"></button>
            <button id="cover-remove" type="button" class="quiet" data-i18n="editor.removeImage"></button>
          </div>
        </div>
        <div class="field"><span data-i18n="editor.background"></span>
          <div class="image-row">
            <span class="thumb" id="background-thumb"></span>
            <button id="background-choose" type="button" data-i18n="editor.chooseImage"></button>
            <button id="background-remove" type="button" class="quiet" data-i18n="editor.removeImage"></button>
          </div>
        </div>
        <div class="field"><span data-i18n="editor.shape"></span>
          <div class="segmented" id="shape">
            <button type="button" data-shape="fill" data-i18n="editor.shapeFill"></button>
            <button type="button" data-shape="square" data-i18n="editor.shapeSquare"></button>
          </div>
          <p class="hint" data-i18n="editor.shapeHint"></p>
        </div>
        <div class="field"><span data-i18n="editor.window"></span>
          <div class="image-row">
            <output id="window-name"></output>
            <button id="window-choose" type="button" data-i18n="editor.chooseWindow"></button>
            <button id="window-remove" type="button" class="quiet" data-i18n="editor.removeWindow"></button>
          </div>
          <ul id="window-list" hidden></ul>
          <p class="hint" id="window-hint"></p>
        </div>
        <button id="delete-game" type="button" class="quiet danger" data-i18n="editor.deleteGame"></button>
      </section>

      <section id="buttons-card" hidden>
        <div class="card-head">
          <h2 data-i18n="editor.buttons"></h2>
          <button id="add-screen" type="button" class="quiet" data-i18n="editor.addScreen"></button>
        </div>
        <div id="screen-tabs" hidden></div>
        <div id="screen-row" hidden>
          <input id="screen-name" type="text" maxlength="24" autocomplete="off">
          <button id="delete-screen" type="button" class="quiet danger" data-i18n="editor.deleteScreen"></button>
        </div>
        <p class="hint" id="screens-hint" data-i18n="editor.screensHint" hidden></p>
        <ul id="button-list"></ul>
        <button id="add-button" type="button" data-i18n="editor.addButton"></button>
      </section>

      <section id="button-card" hidden>
        <h2 data-i18n="editor.button"></h2>
        <label class="field"><span data-i18n="editor.label"></span>
          <input id="button-label" type="text" maxlength="40" autocomplete="off">
        </label>
        <div class="field"><span data-i18n="editor.keys"></span>
          <div id="combo-row">
            <output id="combo"></output>
            <button id="record" type="button" data-i18n="editor.record"></button>
          </div>
          <p id="combo-error" class="error-text" hidden></p>
          <details id="manual">
            <summary data-i18n="editor.manual"></summary>
            <p class="hint" data-i18n="editor.manualHint"></p>
            <div id="manual-row">
              <label><input type="checkbox" data-mod="ControlLeft"> Ctrl</label>
              <label><input type="checkbox" data-mod="ShiftLeft"> Shift</label>
              <label><input type="checkbox" data-mod="AltLeft"> Alt</label>
              <select id="manual-key"></select>
            </div>
          </details>
        </div>
        <div class="field"><span data-i18n="editor.type"></span>
          <div class="segmented" id="button-type">
            <button type="button" data-type="tap" data-i18n="editor.typeTap"></button>
            <button type="button" data-type="hold" data-i18n="editor.typeHold"></button>
          </div>
          <p class="hint" id="type-hint"></p>
        </div>
        <label class="field" id="button-screen-field" hidden><span data-i18n="editor.screen"></span>
          <select id="button-screen"></select>
        </label>
        <div class="field"><span data-i18n="editor.color"></span>
          <div id="colors"></div>
        </div>
        <div class="field"><span data-i18n="editor.image"></span>
          <div class="image-row">
            <span class="thumb" id="image-thumb"></span>
            <button id="image-choose" type="button" data-i18n="editor.chooseImage"></button>
            <button id="image-remove" type="button" class="quiet" data-i18n="editor.removeImage"></button>
          </div>
        </div>
        <div class="row">
          <button id="duplicate-button" type="button" class="quiet" data-i18n="editor.duplicate"></button>
          <button id="delete-button" type="button" class="quiet danger" data-i18n="editor.deleteButton"></button>
        </div>
      </section>
    </div>

    <div class="column" id="right">
      <section id="preview-card" hidden>
        <div class="card-head">
          <h2 data-i18n="editor.preview"></h2>
          <button id="rotate" type="button" class="quiet" data-i18n="editor.rotate"></button>
        </div>
        <div id="phone">
          <div id="phone-head"><span id="phone-name"></span><span class="dot"></span></div>
          <div id="preview-screens" hidden></div>
          <div id="preview"></div>
          <p id="preview-empty" data-i18n="remote.emptyPanel" hidden></p>
        </div>
        <p class="hint" data-i18n="editor.previewHint"></p>
      </section>
      <section>
        <h2 data-i18n="editor.recent"></h2>
        <ul id="recent"></ul>
        <button id="release" type="button" class="quiet" data-i18n="editor.releaseKeys"></button>
      </section>
    </div>
  </main>
  <footer>
    <span id="version"></span>
    <label id="language-row"><span data-i18n="editor.language"></span>
      <select id="language">
        <option value="auto" data-i18n="editor.languageAuto"></option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </label>
    <span class="row">
      <button id="open-folder" type="button" class="quiet" data-i18n="editor.openFolder"></button>
      <button id="quit" type="button" class="quiet" data-i18n="editor.quit"></button>
    </span>
  </footer>
  <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>

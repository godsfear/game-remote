<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Remote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Game Remote</h1>
    <p data-i18n="editor.subtitle"></p>
  </header>
  <p id="fake" class="banner" data-i18n="editor.fakeInput" hidden></p>
  <p id="offline" class="banner bad" data-i18n="editor.offline" hidden></p>
  <main>
    <section id="connect">
      <h2 data-i18n="editor.connect"></h2>
      <div id="qr-box"><img id="qr" alt="QR" hidden><p id="no-address" data-i18n="editor.noAddress" hidden></p></div>
      <p class="hint" data-i18n="editor.connectHint"></p>
      <label id="address-row"><span data-i18n="editor.address"></span>
        <select id="address"></select>
      </label>
      <p id="phones" class="waiting" role="status"></p>
      <details>
        <summary data-i18n="editor.trouble"></summary>
        <ul>
          <li data-i18n="editor.trouble1"></li>
          <li data-i18n="editor.trouble2"></li>
          <li data-i18n="editor.trouble3"></li>
          <li data-i18n="editor.trouble4"></li>
        </ul>
      </details>
    </section>
    <div class="column">
      <section>
        <h2 data-i18n="editor.panels"></h2>
        <ul id="panels"></ul>
        <p class="hint" data-i18n="editor.files"></p>
        <p class="hint"><span data-i18n="editor.folder"></span>: <code id="folder"></code></p>
        <button id="open-folder" type="button" data-i18n="editor.openFolder"></button>
      </section>
      <section>
        <h2 data-i18n="editor.recent"></h2>
        <ul id="recent"></ul>
        <button id="release" type="button" class="quiet" data-i18n="editor.releaseKeys"></button>
      </section>
    </div>
  </main>
  <footer>
    <span id="version"></span>
    <button id="quit" type="button" class="quiet" data-i18n="editor.quit"></button>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12141a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Game Remote</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="/shared/panel-view.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- A playing video keeps the phone screen on; see keepAwake() in app.js. -->
  <video id="awake" muted loop playsinline autoplay disablepictureinpicture aria-hidden="true" tabindex="-1">
    <source src="awake.mp4" type="video/mp4">
    <source src="awake.webm" type="video/webm">
  </video>
  <header>
    <button id="panel-name" type="button" aria-haspopup="listbox"></button>
    <div id="status" class="offline" role="status"><span class="dot"></span><span id="status-text"></span></div>
    <button id="menu-open" type="button" aria-haspopup="dialog">⋮</button>
  </header>
  <p id="notice" data-i18n="remote.lost" hidden></p>
  <main id="grid" aria-live="off"></main>
  <p id="message" hidden></p>
  <div id="panel-list" hidden>
    <h2 data-i18n="remote.choosePanel"></h2>
    <ul id="panel-items"></ul>
  </div>
  <div id="menu" role="dialog" hidden>
    <h2 data-i18n="remote.menu"></h2>
    <ul>
      <li><button id="menu-fullscreen" type="button" data-i18n="remote.fullscreen"></button></li>
      <li><button id="menu-vibration" type="button" data-i18n="remote.vibration"></button></li>
    </ul>
    <p id="menu-delay"></p>
    <p data-i18n="remote.homeHint"></p>
    <button id="menu-close" type="button" data-i18n="remote.close"></button>
  </div>
  <div id="toast" role="alert" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>

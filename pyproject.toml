[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "game-remote"
version = "0.7.0"
description = "Custom buttons for every game — on your phone or tablet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # uvicorn serves WebSocket only when a WebSocket library is installed.
    "websockets>=13",
    "segno>=1.6",
    # Lets Windows check the certificate of GitHub: see updates.py.
    "truststore>=0.10",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyinstaller>=6.6",
]

[project.scripts]
game-remote = "game_remote.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_remote = ["web/**/*", "samples/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The phone test page is inline HTML/JS.
"tools/input_check.py" = ["E501"]

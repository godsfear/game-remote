name: Release

# Builds GameRemote.exe and puts it into a draft release on GitHub.
# Start it by pushing a tag such as v0.1.0, or by hand from the Actions page.
# The draft is not visible to anyone until it is published on the Releases page.
# Publishing creates the tag; the run that this starts sees the published release and stops.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0. Must match the version in pyproject.toml"
        required: true

permissions:
  contents: write

jobs:
  # Publishing a draft creates its tag, and that push starts this workflow again.
  # A tag that already has a published release needs no second build.
  check:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.look.outputs.published }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = "false" ]; then
            echo "Release $TAG is already published: nothing to build."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: The tag must match the version and have its notes
        run: python tools/release_notes.py "$env:TAG" notes.md
      - run: pytest -q
      - run: python tools/build_exe.py
      - name: Start the exe and use it like a phone would
        run: python tools/smoke_test.py dist/GameRemote.exe
      - name: The same with a real key press through SendInput
        run: python tools/smoke_test.py --real-input dist/GameRemote.exe
      - name: Checksum
        shell: bash
        run: cd dist && sha256sum GameRemote.exe > GameRemote.exe.sha256
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft that an earlier run left for the same tag gives way to this build.
          # A published release is never touched: creating over it fails below.
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | tr -d '\r')
          for id in $old; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$TAG" dist/GameRemote.exe dist/GameRemote.exe.sha256 \
            --draft --title "Game Remote ${TAG#v}" --notes-file notes.md --target "$GITHUB_SHA"

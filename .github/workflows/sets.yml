name: Sets

# Packs the sets of the catalogue and puts their zips into the release "sets".
# The page of that release is where players download a set; its address does
# not change. GameRemote.exe is not built here: a new set needs no new program.
#
# Runs when the catalogue or the code that checks it changes on main, or by
# hand from the Actions page.

on:
  push:
    branches: [main]
    paths:
      - "sets/**"
      - "src/game_remote/samples/**"
      - "src/game_remote/panels.py"
      - "tools/build_sets.py"
      - ".github/workflows/sets.yml"
  workflow_dispatch:

permissions:
  contents: write

# Two runs must not change the same release at once.
concurrency: sets

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check every set and pack it
        run: python tools/build_sets.py dist/sets
      - name: Put the zips into the release "sets"
        run: |
          # Never "Latest": that mark belongs to the release of the program.
          if gh release view sets > /dev/null 2>&1; then
            gh release edit sets --title "Sets / Наборы" --notes-file dist/sets/sets.md --latest=false
          else
            gh release create sets --title "Sets / Наборы" --notes-file dist/sets/sets.md \
              --latest=false --target "$GITHUB_SHA"
          fi
          gh release upload sets dist/sets/*.zip --clobber
          # A set that left the catalogue leaves the page too.
          for name in $(gh release view sets --json assets --jq '.assets[].name'); do
            if [ ! -f "dist/sets/$name" ]; then
              gh release delete-asset sets "$name" --yes
            fi
          done
